# Développement local : Postgres 16 + Redis. Les apps tournent avec pnpm.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: walk, POSTGRES_PASSWORD: walk, POSTGRES_DB: walk }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U walk"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
